# Copy .env.example to .env next to this file and fill it in, then: docker compose up -d
#
# The panel runs the published image, pinned to a minor release. To upgrade, change the tag below (or set
# NEBLA_IMAGE in .env) to the new release, then: docker compose pull && docker compose up -d
# Migrations run on start. Patch releases are picked up by `docker compose pull` within the same minor tag.
#
# Developers: build from this checkout instead with
#   NEBLA_IMAGE=nebla:dev docker compose up -d --build
name: nebla

services:
  panel:
    image: ${NEBLA_IMAGE:-ghcr.io/nebla-cloud/nebla:0.2}
    build:
      context: ..
    restart: unless-stopped
    # Shutdown drains HTTP (30s), then jobs (up to 35s); give it room before SIGKILL.
    stop_grace_period: 75s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PANEL_PORT:-8080}:8080"
    environment:
      PANEL_DATABASE_URL: postgres://nebla:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/nebla?sslmode=disable
      PANEL_LISTEN: ":8080"
      PANEL_BASE_URL: ${PANEL_BASE_URL:?set PANEL_BASE_URL in .env}
      PANEL_SECRET_KEY: ${PANEL_SECRET_KEY:?set PANEL_SECRET_KEY in .env}
      PANEL_SMTP_URL: ${PANEL_SMTP_URL:-}
      PANEL_TRUSTED_PROXIES: ${PANEL_TRUSTED_PROXIES:-}
    healthcheck:
      test: ["CMD", "/nebla-server", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nebla
      POSTGRES_USER: nebla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebla -d nebla"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
