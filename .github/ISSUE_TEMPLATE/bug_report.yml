name: Bug report
description: Something in Nebla doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through private vulnerability reporting, never public issues. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Nebla version
      description: The image tag or commit you run.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: pve
    attributes:
      label: Proxmox VE version
      options: ["9.x", "8.4+", "8.0–8.3"]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options: [Docker Compose, Other container setup, Built from source]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a server with ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Panel logs (`docker compose logs panel`) and the failing action's error, with secrets removed.
      render: text
