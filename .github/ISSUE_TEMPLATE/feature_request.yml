name: Feature request
description: Suggest something Nebla should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Who is it for?
      options: [Homelab, Resellers, Both]
    validations:
      required: true
