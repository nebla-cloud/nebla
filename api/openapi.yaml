        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
components:
  responses:
    ActionCreated:
      description: The action
      content:
        application/json:
          schema:
            type: object
            required: [action]
            properties:
              action: { $ref: "#/components/schemas/Action" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: nb_session
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ProjectID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CatalogKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    CatalogLocationID:
      name: location_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
  schemas:
    Role:
      type: string
      enum: [owner, admin, member, read_only]
    TokenPermission:
      type: string
      enum: [read, read_write]
    Quota:
      type: object
      required: [max_servers, max_vcpu, max_memory_mb, max_disk_gb, max_ips]
      properties:
        max_servers: { type: integer, minimum: 0 }
        max_vcpu: { type: integer, minimum: 0 }
        max_memory_mb: { type: integer, minimum: 0 }
        max_disk_gb: { type: integer, minimum: 0 }
        max_ips: { type: integer, minimum: 0 }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    Project:
      type: object
      required: [id, name, role, quota, usage, created]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        quota: { $ref: "#/components/schemas/Quota" }
        usage: { $ref: "#/components/schemas/ProjectUsage" }
        created: { type: string, format: date-time }
    ProjectUsage:
      type: object
      required: [servers, vcpu, memory_mb, disk_gb, ips]
      properties:
        servers: { type: integer }
        vcpu: { type: integer }
        memory_mb: { type: integer }
        disk_gb: { type: integer }
        ips: { type: integer }
    AdminProject:
      type: object
      required: [id, name, quota, owner_email]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        quota: { $ref: "#/components/schemas/Quota" }
        owner_email: { type: string }
    Member:
      type: object
      required: [user_id, email, name, role]
      properties:
        user_id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Invite:
      type: object
      required: [id, email, role, created_by, expires]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_by: { type: integer, format: int64 }
        expires: { type: string, format: date-time }
    ApiToken:
      type: object
      required: [id, name, permission, created, last_used]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        permission: { $ref: "#/components/schemas/TokenPermission" }
        created: { type: string, format: date-time }
        last_used: { type: string, format: date-time, nullable: true }
    User:
      type: object
      required: [id, email, name, is_admin, totp_enabled]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        is_admin: { type: boolean }
        totp_enabled: { type: boolean }
    Credentials:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string }
        password: { type: string }
        name: { type: string }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string }
    InvitePreview:
      type: object
      required: [project_name, email, role, inviter_name, expires, account_exists, can_create_account]
      properties:
        project_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        inviter_name: { type: string }
        expires: { type: string, format: date-time }
        account_exists: { type: boolean }
        can_create_account: { type: boolean }
    MeInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }
    TotpEnroll:
      type: object
      required: [password]
      properties:
        password: { type: string }
    TotpDisable:
      type: object
      required: [code, password]
      properties:
        code: { type: string }
        password: { type: string }
    AdminSettings:
      type: object
      required: [self_signup]
      properties:
        self_signup: { type: boolean }
    UiManifest:
      type: object
      required: [branding, admin_sections, setup_required, signup_enabled]
      properties:
        setup_required: { type: boolean }
        signup_enabled: { type: boolean }
        branding:
          type: object
          required: [product_name, logo_url, primary_color]
          properties:
            product_name: { type: string }
            logo_url: { type: string }
            primary_color: { type: string }
        admin_sections:
          type: array
          items:
            type: object
            required: [id, title, path]
            properties:
              id: { type: string }
              title: { type: string }
              path: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Action:
      type: object
      required: [id, command, status, progress, resources, error, started, finished]
      properties:
        id: { type: integer, format: int64 }
        command: { type: string }
        status: { type: string, enum: [running, success, error] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        resources:
          type: array
          items:
            type: object
            required: [id, type]
            properties:
              id: { type: integer, format: int64 }
              type: { type: string }
        error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code:
              type: string
              description: "Stable kind: failed, timed_out, unreachable, server_missing, server_gone or orphaned"
            message: { type: string, description: Plain text safe to show members }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time, nullable: true }
    AdminAction:
      type: object
      required: [id, project_id, command, status, progress, resources, error, started, finished]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        command: { type: string }
        status: { type: string, enum: [running, success, error] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        resources:
          type: array
          items:
            type: object
            required: [id, type]
            properties:
              id: { type: integer, format: int64 }
              type: { type: string }
        error:
          type: object
          nullable: true
          required: [code, message, detail]
          properties:
            code: { type: string }
            message: { type: string }
            detail: { type: string, description: "Technical cause (VMID, node, Proxmox message); admins only" }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time, nullable: true }
    Meta:
      type: object
      required: [pagination]
      properties:
        pagination:
          type: object
          required: [page, per_page, total_entries]
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total_entries: { type: integer }
    PveConnectionInput:
      type: object
      required: [url, token_id]
      properties:
        url: { type: string, description: "Base URL, e.g. https://host:8006" }
        token_id: { type: string }
        token_secret: { type: string, description: "Required on create; omitted on update keeps the stored secret" }
        ca_fingerprint: { type: string, description: "SHA-256 of the leaf certificate, colon-hex" }
        insecure_tls: { type: boolean }
    PveConnection:
      type: object
      required: [url, token_id, has_secret, ca_fingerprint, insecure_tls]
      properties:
        url: { type: string }
        token_id: { type: string }
        has_secret: { type: boolean }
        ca_fingerprint: { type: string }
        insecure_tls: { type: boolean }
    LocationInput:
      type: object
      required: [name, pve, disk_storage, iso_storage]
      properties:
        name: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
        description: { type: string }
        pve: { $ref: "#/components/schemas/PveConnectionInput" }
        disk_storage: { type: string }
        iso_storage: { type: string }
        import_storage: { type: string, description: "Storage with the import content type, for building catalog templates; empty disables it" }
    Node:
      type: object
      required: [id, name, status, enabled, disk_storage_override, max_cpu, max_mem, cpu, mem, updated]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string }
        enabled: { type: boolean }
        disk_storage_override: { type: string, description: "Empty uses the location's disk_storage" }
        max_cpu: { type: integer }
        max_mem: { type: integer, format: int64, description: Bytes }
        cpu: { type: number, format: double, description: "Load fraction 0-1" }
        mem: { type: integer, format: int64, description: Bytes }
        updated: { type: string, format: date-time }
    NodeInput:
      type: object
      properties:
        enabled: { type: boolean }
        disk_storage_override: { type: string, description: "Empty clears the override" }
    AdminLocation:
      type: object
      required: [id, name, description, pve, disk_storage, iso_storage, import_storage, nodes, created, updated]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        pve: { $ref: "#/components/schemas/PveConnection" }
        disk_storage: { type: string }
        iso_storage: { type: string }
        import_storage: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/Node" }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    EnrollCheck:
      type: object
      required: [token_name, location, expires_at]
      properties:
        token_name: { type: string }
        location: { type: string, description: The location name }
        expires_at: { type: string, format: date-time }
    EnrollmentReport:
      type: object
      required: [pve_version, node, token_id, nodes, storages]
      properties:
        pve_version: { type: string }
        node: { type: string }
        token_id: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/EnrollmentReportNode" }
        storages:
          type: array
          items: { $ref: "#/components/schemas/EnrollmentReportStorage" }
    EnrollmentReportNode:
      type: object
      required: [name, ip, online, fingerprint]
      properties:
        name: { type: string }
        ip: { type: string }
        online: { type: boolean }
        fingerprint: { type: string }
    EnrollmentReportStorage:
      type: object
      required: [id, type, content, shared, nebla_iso]
      properties:
        id: { type: string }
        type: { type: string }
        content:
          type: array
          items: { type: string }
        shared: { type: boolean }
        nebla_iso: { type: boolean }
    LocationEnrollment:
      type: object
      required: [id, name, description, location_id, token_name, state, expired, expires_at, created, report]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        location_id: { type: integer, format: int64, nullable: true, description: Set for a re-run of an existing location }
        token_name: { type: string }
        state:
          type: string
          enum: [waiting, reported]
        expired: { type: boolean }
        expires_at: { type: string, format: date-time }
        created: { type: string, format: date-time }
        report:
          allOf: [{ $ref: "#/components/schemas/EnrollmentReport" }]
          nullable: true
    LocationEnrollmentInput:
      type: object
      description: Exactly one of name (a new location) or location_id (a re-run)
      properties:
        name: { type: string }
        description: { type: string }
        location_id: { type: integer, format: int64 }
    LocationEnrollmentCreated:
      type: object
      description: The token, command and offline script are shown only in this response
      required: [enrollment, token, command, offline_script]
      properties:
        enrollment: { $ref: "#/components/schemas/LocationEnrollment" }
        token: { type: string }
        command: { type: string }
        offline_script: { type: string }
    LocationEnrollmentFinish:
      type: object
      required: [url, disk_storage, iso_storage]
      properties:
        url: { type: string }
        disk_storage: { type: string }
        iso_storage: { type: string }
        import_storage: { type: string }
    LocationEnrollmentFinished:
      type: object
      required: [location, cleanup]
      properties:
        location: { $ref: "#/components/schemas/AdminLocation" }
        cleanup:
          type: array
          description: Optional pveum commands for the admin to run on the node
          items: { type: string }
    LocationRef:
      type: object
      required: [id, name, description]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
    Location:
      type: object
      required: [id, name, description, networks]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        networks:
          type: object
          description: Whether the location has a free address of each family
          required: [ipv4, ipv6]
          properties:
            ipv4: { type: boolean }
            ipv6: { type: boolean }
    ServerTypeInput:
      type: object
      required: [name, cores, memory_mb, disk_gb]
      properties:
        name: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
        description: { type: string }
        cores: { type: integer, minimum: 1 }
        memory_mb: { type: integer, minimum: 1 }
        disk_gb: { type: integer, minimum: 1 }
        locations:
          type: array
          description: Location ids; empty or omitted means every location
          items: { type: integer, format: int64 }
        deprecated: { type: boolean }
    ServerType:
      type: object
      required: [id, name, description, cores, memory_mb, disk_gb, locations, deprecated]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        cores: { type: integer }
        memory_mb: { type: integer }
        disk_gb: { type: integer }
        locations:
          type: array
          items: { type: integer, format: int64 }
        deprecated: { type: boolean }
    ServerTypeList:
      type: object
      required: [server_types, meta]
      properties:
        server_types:
          type: array
          items: { $ref: "#/components/schemas/ServerType" }
        meta: { $ref: "#/components/schemas/Meta" }
    ImageTemplate:
      type: object
      required: [location_id, vmid]
      properties:
        location_id: { type: integer, format: int64 }
        node: { type: string, description: "Omit when the template sits on shared storage" }
        vmid: { type: integer }
    ImageInput:
      type: object
      required: [name, os_flavor, os_version, templates]
      properties:
        name: { type: string }
        description: { type: string }
        os_flavor: { type: string }
        os_version: { type: string }
        templates:
          type: array
          items: { $ref: "#/components/schemas/ImageTemplate" }
    AdminImage:
      type: object
      required: [id, name, description, os_flavor, os_version, templates, created]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        os_flavor: { type: string }
        os_version: { type: string }
        catalog_key: { type: string, nullable: true, readOnly: true, description: "Set for images owned by the OS catalog; those are read-only" }
        templates:
          type: array
          items: { $ref: "#/components/schemas/ImageTemplate" }
        created: { type: string, format: date-time }
    CatalogNode:
      type: object
      required: [node, status, vmid, file, built_at, error]
      properties:
        node: { type: string, description: "Empty for shared disk storage" }
        status: { type: string, description: "building, ready or failed" }
        vmid: { type: integer, nullable: true }
        file: { type: string }
        built_at: { type: string, format: date-time, nullable: true }
        error: { type: string }
    CatalogLocationState:
      type: object
      required: [location_id, available, reason, state, nodes]
      properties:
        location_id: { type: integer, format: int64 }
        available: { type: boolean }
        reason: { type: string }
        state: { type: string, description: "unavailable, off, building, ready, failed, partial or retired" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/CatalogNode" }
    CatalogLocationResult:
      type: object
      required: [location]
      properties:
        location: { $ref: "#/components/schemas/CatalogLocationState" }
    CatalogEntry:
      type: object
      required: [key, description, os_flavor, os_version, retired, locations]
      properties:
        key: { type: string }
        description: { type: string }
        os_flavor: { type: string }
        os_version: { type: string }
        retired: { type: boolean }
        locations:
          type: array
          items: { $ref: "#/components/schemas/CatalogLocationState" }
    Image:
      type: object
      required: [id, name, description, os_flavor, os_version, locations]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        os_flavor: { type: string }
        os_version: { type: string }
        locations:
          type: array
          items: { type: integer, format: int64 }
    IpPoolInput:
      type: object
      required: [location_id, family, bridge, cidr, gateway, dns, range_start, range_end]
      properties:
        location_id: { type: integer, format: int64 }
        family: { type: string, enum: [ipv4, ipv6] }
        bridge: { type: string }
        vlan_tag: { type: integer, minimum: 1, maximum: 4094 }
        cidr: { type: string }
        gateway: { type: string }
        dns:
          type: array
          items: { type: string }
        range_start: { type: string }
        range_end: { type: string }
    IpPool:
      type: object
      required: [id, location_id, family, bridge, cidr, gateway, dns, range_start, range_end, allocated, created]
      properties:
        id: { type: integer, format: int64 }
        location_id: { type: integer, format: int64 }
        family: { type: string, enum: [ipv4, ipv6] }
        bridge: { type: string }
        vlan_tag: { type: integer }
        cidr: { type: string }
        gateway: { type: string }
        dns:
          type: array
          items: { type: string }
        range_start: { type: string }
        range_end: { type: string }
        allocated: { type: integer }
        created: { type: string, format: date-time }
    SshKey:
      type: object
      required: [id, name, public_key, fingerprint, created]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        public_key: { type: string }
        fingerprint: { type: string, description: "MD5, colon-hex" }
        created: { type: string, format: date-time }
    Labels:
      type: object
      description: "At most 64; keys and values are 1-63 of [A-Za-z0-9._-] (keys may also use /), starting and ending alphanumeric; values may be empty"
      additionalProperties: { type: string }
    ServerInput:
      type: object
      required: [name, server_type, image, location]
      properties:
        name: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        server_type: { type: string, description: Server type id or name }
        image: { type: string, description: Image id or name }
        location: { type: string, description: Location id or name }
        ssh_keys:
          type: array
          description: The project's SSH key ids or names
          items: { type: string }
        user_data: { type: string, description: "Cloud-init user data, at most 32 KiB" }
        public_net:
          type: object
          properties:
            ipv4: { type: boolean, default: true }
            ipv6: { type: boolean, default: false }
        labels: { $ref: "#/components/schemas/Labels" }
        start_after_create: { type: boolean, default: true }
    ServerUpdate:
      type: object
      properties:
        name: { type: string }
        labels: { $ref: "#/components/schemas/Labels" }
    RebuildInput:
      type: object
      required: [image]
      properties:
        image: { type: string, description: Image id or name }
    ConsoleGrant:
      type: object
      required: [wss_url, password]
      properties:
        wss_url: { type: string }
        password: { type: string }
    Metrics:
      type: object
      required: [start, end, step, time_series]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        step: { type: integer, description: Seconds between points }
        time_series:
          type: object
          description: >-
            Keys cpu (percent 0-100 of the VM's cores), disk.read, disk.write, network.in and network.out (bytes/s).
            Each value is a list of [unix_ts, value] pairs; value is null where Proxmox has no sample.
          additionalProperties:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number, format: double, nullable: true }
    ChangeTypeInput:
      type: object
      required: [server_type, upgrade_disk]
      properties:
        server_type: { type: string, description: Server type id or name }
        upgrade_disk: { type: boolean, description: Grow the disk to the type's size; disks never shrink }
    ServerIp:
      type: object
      nullable: true
      required: [ip]
      properties:
        ip: { type: string }
    Server:
      type: object
      required: [id, name, status, location, server_type, image, public_net, labels, disk_gb, created]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status:
          type: string
          enum: [initializing, starting, running, stopping, "off", rebuilding, deleting, missing, error]
        location: { $ref: "#/components/schemas/LocationRef" }
        server_type: { $ref: "#/components/schemas/ServerType" }
        image: { $ref: "#/components/schemas/Image" }
        public_net:
          type: object
          required: [ipv4, ipv6]
          properties:
            ipv4: { $ref: "#/components/schemas/ServerIp" }
            ipv6: { $ref: "#/components/schemas/ServerIp" }
        labels: { $ref: "#/components/schemas/Labels" }
        disk_gb: { type: integer }
        created: { type: string, format: date-time }
